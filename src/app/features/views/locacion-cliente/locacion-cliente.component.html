<section class="h-[100vh] w-full  dark:bg-neutral-800  w-full ">
    <div class="container mx-auto p-4 rounded-lg  z-10  bg-white dark:bg-neutral-800 dark:border dark:border-white">

        <mat-tab-group mat-stretch-tabs #tabGroup>

            <mat-tab label="Agregar Dirección"> <app-locaciones-cliente-form [id]="id"
                    [direccionId]="idDireccionParaEditar"
                    (formularioEnviado)="onFormularioEnviado()"></app-locaciones-cliente-form>
            </mat-tab>
            <mat-tab label="Direcciones Asociadas">

                <app-expansion-panel-locacion-cliente [id]="id"
                    (editarDireccionEvent)="onEditarDireccion($event)"></app-expansion-panel-locacion-cliente>

            </mat-tab>

        </mat-tab-group>
    </div>

</section>
