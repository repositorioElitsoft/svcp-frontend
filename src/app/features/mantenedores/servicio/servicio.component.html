<div class="grid grid-cols-10">
    <div class="col-span-0 sm:col-span-1"></div>
    <div class="col-span-10 sm:col-span-8 px-[5%] sm:px-0">
        <div
            class="container mx-auto p-4 rounded-lg overflow-hidden z-10  bg-white dark:bg-neutral-800 dark:border dark:border-white">

            <!-- Contenedor del botón y el título -->
            <div class="flex sm:flex-row items-center sm:space-x-2 w-full sm:w-auto  p-4">
                <!-- Botón regresar (más grande en móvil) -->
                <button class="elitsoft-warn text-base sm:text-base w-auto sm:w-auto" (click)="volver()">
                    <mat-icon>arrow_back</mat-icon> {{ 'mantenedores.volver' | translate }}
                </button>
                <!-- Titulo centrado en móvil y a la izquierda en desktop -->
                <h1 class="text-xl sm:text-center sm:w-auto w-full text-center sm:text-left">
                    {{ 'mantenedores.servicio.titulo' | translate }}
                </h1>
            </div>
            <!-- Header Section -->
            <div
                class="bg-white p-4 rounded-lg flex flex-col sm:flex-row justify-between items-center gap-4 dark:bg-neutral-800 sm:mb-0">

                <!-- Contenedor del botón y el título -->
                <div class="flex sm:flex-row items-center sm:space-x-2 w-full sm:w-auto ">

                </div>

                <!-- Opciones del mantenedor -->
                <div class="w-full sm:w-auto ">
                    <app-opciones-mantenedor [hasSelection]="hasSelection" [selectedData]="selectedData"
                        (agregar)="agregarServicio()" (exportar)="exportarExcel()" (eliminar)="eliminar($event)">
                    </app-opciones-mantenedor>
                </div>

            </div>

            <!--Search Personalizado-->
            <div class="">
                <div class="flex flex-col md:flex-row items-center lg:items-end gap-4 p-4">
                    <!-- Campo de búsqueda -->
                    <div class="w-full md:w-auto">
                        <div class="relative w-full md:w-[240px] lg:w-[300px]">
                            <input [(ngModel)]="searchValue" type="text"
                                class="w-full h-[44px] px-4 py-2 rounded-lg border-2 border-[#C2C2C2] bg-white text-[#757575] text-lg outline-none focus:border-[#3f51b5]"
                                (ngModelChange)="onSearchValueChange()"
                                [placeholder]="('table.digiteBusqueda' | translate) + ' ' + ('mantenedores.servicio.descripcion' | translate)" />
                            <button class="absolute right-3 top-1/2 transform -translate-y-1/2"
                                [ngClass]="{'text-red-500': searchValue, 'text-[#757575]': !searchValue}"
                                (click)="searchValue ? clearSearchInput() : null">
                                <mat-icon>{{searchValue ? 'close' : 'search'}}</mat-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Select de Tipo Servicio -->
                    <div class="w-full md:w-auto self-end md:mx-4">
                        <div class="relative w-full md:w-[160px] lg:w-[200px]">
                            <mat-select [(ngModel)]="selectedTipoServicio" (selectionChange)="onSearchValueChange()"
                                [placeholder]="'mantenedores.servicio.tipoServicio' | translate"
                                class="block w-full h-[44px] px-4 py-2 text-lg text-[#757575] bg-white border-2 border-[#C2C2C2] rounded-lg appearance-none focus:outline-none focus:border-[#3f51b5]">
                                <mat-option [value]="null">{{ 'mantenedores.seleccion' | translate }}</mat-option>
                                <mat-option *ngFor="let tipo of tiposServicio" [value]="tipo">
                                    {{ tipo.descripcionTipoServicio }}
                                </mat-option>
                            </mat-select>
                        </div>
                    </div>

                    <!-- Select de Estado -->
                    <div class="w-full md:w-auto self-end">
                        <div class="relative w-full md:w-[160px] lg:w-[200px]">
                            <mat-select [(ngModel)]="selectedEstado" (selectionChange)="onSearchValueChange()"
                                [placeholder]="'mantenedores.servicio.estado' | translate"
                                class="block w-full h-[44px] px-4 py-2 text-lg text-[#757575] bg-white border-2 border-[#C2C2C2] rounded-lg appearance-none focus:outline-none focus:border-[#3f51b5]">
                                <mat-option [value]="null">{{ 'mantenedores.seleccion' | translate }}</mat-option>
                                <mat-option *ngFor="let estado of estados" [value]="estado">
                                    {{ estado.descripcion }}
                                </mat-option>
                            </mat-select>
                        </div>
                    </div>

                    <!-- Botón de búsqueda -->
                    <button (click)="executeSearch()"
                        class="w-full md:w-auto h-[44px] px-4 md:px-6 rounded-lg bg-[#3f51b5] text-white hover:bg-[#303f9f] transition-colors">
                        {{ 'mantenedores.buscar' | translate }}
                    </button>
                </div>
            </div>

            <!-- Table Section -->

            <div class="bg-white p-4 rounded-lg mb-4  dark:bg-neutral-800">
                <app-shared-table-v2 (applyfilter)="buscar($event)" [filtersLabels]="activeOptionalFilters"
                    [translationGroup]="'mantenedores.servicio'" [displayedColumns]="displayedColumns"
                    [columnConfig]="columnConfig" [dataSource]="dataSource" [pageNumber]="pageNumber"
                    [totalElements]="totalElements" [totalPages]="totalPages" [pageSize]="pageSize"
                    (deleteSingleSelected)="onDeleteSingleSelected($event)" (deleteSelected)="onDeleteSelected($event)"
                    (viewSelected)="onViewSelected($event)" (pageChanged)="onPageChanged($event)"
                    (sort)="sortDatos($event)" (editSelected)="onEditSelected($event)"
                    (selectionChange)="onSelectionChange($event)" [simpleSearchField]="'descripcion'"
                    (filterDelete)="onFilterDeleted($event)" [filters]='[]' (asignacion)="onAsignacion($event)"
                    (filter)="onFilter($event)" (delete)="onDelete($event)" (edit)="onEdit($event)">
                </app-shared-table-v2>
            </div>
        </div>

        <div class="col-span-0 sm:col-span-1"></div>

        <section class="min-h-10 w-full dark:bg-neutral-800">
        </section>
    </div>
</div>
