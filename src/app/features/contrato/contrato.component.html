<section class="h-[100vh] w-full  dark:bg-neutral-800  w-full ">
    <div
        class="container mx-auto p-4 rounded-lg overflow-hidden z-10  bg-white dark:bg-neutral-800 dark:border dark:border-white">
        <!-- Header Section -->
        <div
            class="bg-white p-4 rounded-lg flex flex-col sm:flex-row justify-between items-center sm:items-center mb-4 gap-4 dark:bg-neutral-800">
            <div class="flex sm:flex-row items-center sm:space-x-2 w-full sm:w-auto">
                <!-- Botón regresar (más grande en móvil) -->
                <button class="elitsoft-btn text-base sm:text-base w-auto sm:w-auto" (click)="volver()">
                    <mat-icon>arrow_back</mat-icon> {{ 'mantenedores.volver' | translate }}
                </button>
                <!-- Titulo centrado en móvil y a la izquierda en desktop -->
                <h1 class="text-xl sm:text-center sm:w-auto w-full text-center sm:text-left">
                    {{ 'contrato.titulo' | translate }}
                </h1>
            </div>

        </div>

        <!-- Sección Filtro -->
        <div class="bg-blue-500 w-full h-12  p-4 gap-4 dark:bg-neutral-800">
            <app-filtros-contrato></app-filtros-contrato>
        </div>
        <section class="h-14"></section>
        <!-- Sección Etiqueta -->
        <div class="bg-red-500 w-full h-12 mt-6 mb-6 p-4 gap-4 dark:bg-neutral-800 grid grid-cols-2">
            <div></div> <!-- Columna 1 vacía -->
            <div class="flex items-center justify-center"> <!-- Columna 2 con el h1 -->
                <h1>ETIQUETA NUMERO CONTRATO</h1>
            </div>
        </div>



        <!-- Sección Etiqueta -->
        <div class="bg-green-500 mt-6  mb-6w-full h-12  p-4 gap-4 dark:bg-neutral-800">
            <app-cliente-contrato></app-cliente-contrato>
        </div>


        <!-- Sección Etiqueta -->
        <div class="bg-yellow-500 mt-6  mb-6w-full h-12  p-4 gap-4 dark:bg-neutral-800">
            <app-locacion></app-locacion>
        </div>










    </div>
</section>
