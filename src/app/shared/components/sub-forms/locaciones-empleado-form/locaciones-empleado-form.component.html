<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 p-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Primera fila -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Estado</mat-label>
            <mat-select formControlName="estado">
                <mat-option *ngFor="let est of estados" [value]="est.id">{{ est.descripcion }}</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Comuna</mat-label>
            <mat-select formControlName="comuna">
                <mat-option *ngFor="let com of comunas" [value]="com">{{ com.descripcionComuna }}</mat-option>
            </mat-select>
        </mat-form-field>

        <!-- Segunda fila -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Dirección</mat-label>
            <input matInput #autocompleteInput placeholder="Ingrese Calle y Número" formControlName="calle">
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nº de calle</mat-label>
            <input matInput formControlName="numeracion" placeholder="Nº de calle">
        </mat-form-field>

        <!-- Tercera fila -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Referencia</mat-label>
            <textarea matInput formControlName="referencia" rows="3" placeholder="Referencia"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Descripción</mat-label>
            <textarea matInput formControlName="descripcion" rows="3" placeholder="Descripción"></textarea>
        </mat-form-field>
    </div>

    <!-- Mapa -->
    <div class="mt-4 border rounded-lg overflow-hidden">
        <app-map [initialPosition]="initialPosition" [markerPosition]="currentMarkerPosition"
            (positionChanged)="onMapPositionChanged($event)">
        </app-map>
    </div>

    <!-- Botón de guardar -->
    <div class="flex justify-end mt-6">
        <button class="elitsoft-btn" type="submit" class="px-6">
            Guardar
        </button>
    </div>
</form>
