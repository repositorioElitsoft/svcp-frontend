<app-titulo-dialogo
	[title]="(esActualizar() ? 'mantenedores.formularios.sector.tituloEditar' : 'mantenedores.formularios.sector.tituloAgregar') | translate"
	icon="task" [ref]="dialogRef"></app-titulo-dialogo>

<mat-dialog-content class="!p-0">
	<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
		<mat-form-field appearance="outline" class="w-full">
			<mat-label>{{ 'mantenedores.formularios.sector.label' | translate }}</mat-label>
			<input matInput formControlName="descripcionSector" placeholder="Ingrese la descripción" class="w-full">
			<mat-error *ngIf="form.get('descripcionSector')?.hasError('required')" class="text-red-500">
				{{ 'mantenedores.formularios.campoRequerido' | translate }}
			</mat-error>
		</mat-form-field>

		<mat-form-field appearance="outline" class="w-full">
			<mat-label>Descripción Sector</mat-label>
			<mat-select formControlName="zona">
				<mat-option *ngFor="let option of zona" [value]="option">
					{{ option.descripcionZona}}
				</mat-option>
			</mat-select>
			<mat-error *ngIf="form.get('zona')?.hasError('required')" class="text-red-500">
				{{ 'mantenedores.formularios.campoRequerido' | translate }}
			</mat-error>

		</mat-form-field>


		<div class="grid grid-cols-2 gap-4 w-full">
			<button type="button" (click)="dialogRef.close()"
				class="elitsoft-warn w-full flex items-center justify-center py-2 text-center">
				{{ 'mantenedores.formularios.botonCancelar' | translate }}
			</button>
			<button type="submit" [disabled]="form.invalid"
				class="elitsoft-btn w-full flex items-center justify-center py-2 text-center disabled:opacity-50">
				{{ (esActualizar() ? 'mantenedores.formularios.actualizar' :
				'mantenedores.formularios.guardar') |
				translate }}
			</button>
		</div>
	</form>
</mat-dialog-content>
