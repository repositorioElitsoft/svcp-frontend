<app-titulo-dialogo
	[title]="(esActualizar() ? 'mantenedores.formularios.agrupacionComercial.tituloEditar' : 'mantenedores.formularios.agrupacionComercial.tituloAgregar') | translate"
	icon="task" [ref]="dialogRef">
</app-titulo-dialogo>

<mat-dialog-content class="!p-0">
	<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
		<mat-form-field appearance="outline" class="w-full">
			<mat-label>{{ 'mantenedores.formularios.clasificacionCliente.label' | translate }}</mat-label>
			<input matInput formControlName="descripcion" 
			[attr.placeholder]="'mantenedores.formularios.clasificacionCliente.descripcion' | translate"
			class="w-full">
			<mat-error *ngIf="form.get('descripcion')?.hasError('required')" class="text-red-500">
				{{ 'mantenedores.formularios.segmentacionCliente.campoRequerido' | translate }}
			</mat-error>
		</mat-form-field>
		<div class="grid grid-cols-2 gap-4 w-full">
			<button type="button" (click)="dialogRef.close()"
				class="elitsoft-warn w-full flex items-center justify-center py-2 text-center">
				{{ 'mantenedores.formularios.botonCancelar' | translate }}
			</button>
			<button type="submit" [disabled]="form.invalid"
				class="elitsoft-btn w-full flex items-center justify-center py-2 text-center disabled:opacity-50">
				{{ (esActualizar() ? 'mantenedores.formularios.actualizar' :
				'mantenedores.formularios.guardar') |
				translate }}
			</button>
		</div>
	</form>
</mat-dialog-content>
