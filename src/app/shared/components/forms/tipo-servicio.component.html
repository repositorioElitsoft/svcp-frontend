<app-titulo-dialogo
	[title]="(esActualizar() ? 'mantenedores.formularios.tipoServicio.tituloEditar' : 'mantenedores.formularios.tipoServicio.tituloAgregar') | translate"
	icon="task" [ref]="dialogRef">
</app-titulo-dialogo>

<mat-dialog-content class="!p-0 dark:bg-neutral-800">
	<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
		<mat-form-field appearance="outline" class="w-full dark:text-white  ">
			<mat-label>{{ 'mantenedores.formularios.tipoServicio.label' | translate }}</mat-label>
			<input matInput formControlName="descripcionTipoServicio"
				[attr.placeholder]="'mantenedores.formularios.tipoServicio.descripcion' | translate"
				class="w-full dark:text-white">
			<mat-error *ngIf="form.get('descripcionTipoServicio')?.hasError('required')" class="text-red-500 text-base">
				{{ 'mantenedores.formularios.tipoServicio.campoRequerido' | translate }}
			</mat-error>
		</mat-form-field>
		<div class="grid grid-cols-2 gap-4 w-full">
			<button type="button" (click)="dialogRef.close()"
				class="elitsoft-warn w-full flex items-center justify-center text-base py-2 text-center">
				{{ 'mantenedores.formularios.botonCancelar' | translate }}
			</button>
			<button type="submit" [disabled]="form.invalid"
				class="elitsoft-btn w-full flex items-center justify-center py-2 text-center   text-base disabled:opacity-50">
				{{ (esActualizar() ? 'mantenedores.formularios.actualizar' :
				'mantenedores.formularios.guardar') |
				translate }}
			</button>
		</div>
	</form>
</mat-dialog-content>
