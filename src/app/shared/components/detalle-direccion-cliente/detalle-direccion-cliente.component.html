<div class="p-6 space-y-6">
    <!-- UBICACIÓN DETALLADA Section -->
    <div class="space-y-4">
        <h2 class="text-lg font-semibold text-gray-800">UBICACIÓN DETALLADA</h2>

        <div class="grid grid-cols-2 gap-4">
            <!-- Left Column -->
            <div class="space-y-4">
                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Nombre de la locación</mat-label>
                    <input matInput [value]="ubicacionData?.nombre" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>País</mat-label>
                    <input matInput [value]="ubicacionData?.pais" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Región</mat-label>
                    <input matInput [value]="ubicacionData?.region" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Ciudad</mat-label>
                    <input matInput [value]="ubicacionData?.ciudad" readonly>
                </mat-form-field>
            </div>

            <!-- Right Column -->
            <div class="space-y-4">
                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Comuna</mat-label>
                    <input matInput [value]="ubicacionData?.comuna" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Provincia</mat-label>
                    <input matInput [value]="ubicacionData?.provincia" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Zona</mat-label>
                    <input matInput [value]="ubicacionData?.zona" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Sector</mat-label>
                    <input matInput [value]="ubicacionData?.sector" readonly>
                </mat-form-field>
            </div>
        </div>
    </div>

    <!-- CONFIGURACIONES ADICIONALES Section -->
    <div class="space-y-4">
        <h2 class="text-lg font-semibold text-gray-800">CONFIGURACIONES ADICIONALES</h2>

        <div class="grid grid-cols-2 gap-4">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Referencia</mat-label>
                <input matInput [value]="ubicacionData?.referencia" readonly>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Tipo de locación</mat-label>
                <input matInput [value]="ubicacionData?.tipoLocacion" readonly>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Oficina</mat-label>
                <input matInput [value]="ubicacionData?.oficina" readonly>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Estado</mat-label>
                <input matInput [value]="ubicacionData?.estado" readonly>
            </mat-form-field>
        </div>
    </div>

    <!-- CONTACTOS Section -->
    <div class="space-y-4">
        <h2 class="text-lg font-semibold text-gray-800">CONTACTOS ({{contactos.length}})</h2>

        <div class="space-y-4">
            <div *ngFor="let contacto of contactos" class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                <div class="flex items-center space-x-4">
                    <mat-icon class="text-gray-600">person</mat-icon>
                    <div>
                        <p class="font-medium">{{contacto.nombre}}</p>
                        <p class="text-sm text-gray-600">{{contacto.email}} - {{contacto.rol}}</p>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button mat-icon-button color="primary">
                        <mat-icon>visibility</mat-icon>
                    </button>
                    <button mat-icon-button color="primary">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <button mat-stroked-button color="primary" class="flex items-center space-x-1">
                    <mat-icon>add</mat-icon>
                    <span>Agregar Contacto</span>
                </button>
                <div class="flex items-center">
                    <mat-form-field appearance="outline" class="w-64">
                        <mat-label>Rol</mat-label>
                        <input matInput placeholder="Seleccionar contacto">
                    </mat-form-field>
                    <button mat-flat-button color="primary" class="ml-2">
                        Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
